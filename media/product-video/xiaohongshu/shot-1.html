<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="style.css"><body class="s1"><div class="grain"></div><header><img src="assets/logo.png"><b>倾盖如故</b><span>把每一次见面留下来</span></header><main><div class="copy"><label> 开始记录 / 02</label><h1>先好好聊，<br>记录交给倾盖如故。</h1><p>无需注册，即可开始本地录音</p></div><div class="art"><img src="assets/01-recording-roles.png"></div></main><footer>请确保现场人员知情并同意录音</footer><div class="progress"></div><script>window.film={duration:6,frame(t){const p=Math.min(1,t/0.7);const e=1-Math.pow(1-p,3);document.querySelector('main').style.opacity=e;document.querySelector('.copy').style.transform=`translateY(${(1-e)*45}px)`;document.querySelector('.art,.orbit,.social').style.transform=`translateY(${(1-e)*65}px) scale(${.96+.04*e+t*.002})`;document.querySelector('.progress').style.width=`${(t/6)*100}%`;}};</script></body></html>
