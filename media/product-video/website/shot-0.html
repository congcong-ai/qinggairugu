<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="style.css"><body class="s0"><div class="grain"></div><header><img src="assets/logo.png"><b>倾盖如故</b><span>把每一次见面留下来</span></header><main><div class="copy"><label> 开始记录 / 01</label><h1>见过面，<br>然后呢？</h1><p>谁来了 · 聊了什么 · 后来怎么找回来</p></div><div class="orbit"><span>见面</span><span>记录</span><span>回顾</span><div class="center"><img src="assets/logo.png"></div></div></main><footer>每一次相遇，都值得留下。</footer><div class="progress"></div><script>window.film={duration:6,frame(t){const p=Math.min(1,t/0.7);const e=1-Math.pow(1-p,3);document.querySelector('main').style.opacity=e;document.querySelector('.copy').style.transform=`translateY(${(1-e)*45}px)`;document.querySelector('.art,.orbit,.social').style.transform=`translateY(${(1-e)*65}px) scale(${.96+.04*e+t*.002})`;document.querySelector('.progress').style.width=`${(t/6)*100}%`;}};</script></body></html>
