packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: false
  core-js-pure: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.11'
  - '@expo/schema-utils@58.0.2'
  - '@turbo/darwin-64@2.11.9'
  - '@turbo/darwin-arm64@2.11.9'
  - '@turbo/linux-64@2.11.9'
  - '@turbo/linux-arm64@2.11.9'
  - '@turbo/windows-64@2.11.9'
  - '@turbo/windows-arm64@2.11.9'
  - babel-preset-expo@58.0.17
  - expo-crypto@58.0.7
  - expo-dev-client@58.0.14
  - expo-dev-launcher@58.0.14
  - expo-glass-effect@58.0.4
  - expo-modules-core@58.0.22
  - expo-modules-jsi@58.0.15
  - expo-router@58.0.23
  - expo-splash-screen@58.0.10
  - expo@58.0.14
  - turbo@2.11.9
  - eslint@10.13.0

patchedDependencies:
  expo-audio@58.0.9: patches/expo-audio@58.0.9.patch
